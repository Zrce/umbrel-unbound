manifestVersion: 1
id: unbound
category: networking
name: "Unbound"
icon: https://raw.githubusercontent.com/Zrce/umbrel-unbound/main/unbound/images/icon.svg
version: "1.26.0"
tagline: "Validating, recursive, and caching DNS resolver for full privacy"
description: >-
  Unbound is a validating, recursive, and caching DNS resolver developed by
  NLnet Labs. It is designed to be fast and lean and incorporates modern
  features based on open standards. Unbound resolves your DNS queries
  directly against root nameservers, so no third-party DNS provider like
  Google or Cloudflare ever sees your queries.


  Unbound validates every response with DNSSEC and uses query name
  minimisation (RFC 7816) to limit the data sent to authoritative
  nameservers. Aggressive NSEC caching reduces unnecessary lookups.


  Designed to work alongside Pi-hole. After installing, set your Pi-hole
  upstream DNS to 127.0.0.1#5335 and disable Pi-hole's built-in DNSSEC
  (Unbound handles it). Your DNS stack becomes fully self-contained —
  Pi-hole blocks ads, Unbound resolves everything privately.


  Unbound has no web interface. It runs as a background DNS service on
  port 5335.
releaseNotes: >-
  Updated to Unbound v1.25.2.
