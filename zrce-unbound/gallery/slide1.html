<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #fff; }
    .capture {
      width: 1440px;
      height: 900px;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #112b11;
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
    }
    h1 {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.15;
      color: #fff;
      text-align: center;
      margin-bottom: 24px;
    }
    h1 span { color: #5b9bf0; }
    .subtitle {
      font-size: 20px;
      color: #777;
      line-height: 1.6;
      text-align: center;
      max-width: 500px;
    }
  </style>
</head>
<body>

  <div class="capture">
    <div class="badge">Recursive DNS Resolver</div>
    <h1>No third-party<br>DNS provider.<br><span>Ever.</span></h1>
    <p class="subtitle">
      Unbound resolves every query directly against
      root nameservers. Your browsing stays private.
    </p>
  </div>

</body>
</html>
