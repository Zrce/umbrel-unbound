<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #fff; }
    .capture {
      width: 1440px;
      height: 900px;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f1a2e;
      color: #5b9bf0;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 32px;
      text-align: center;
    }
    .steps {
      list-style: none;
      counter-reset: step;
      max-width: 520px;
    }
    .steps li {
      counter-increment: step;
      padding: 14px 0;
      padding-left: 48px;
      position: relative;
      font-size: 20px;
      color: #aaa;
      border-bottom: 1px solid #1a1a1a;
    }
    .steps li:last-child { border-bottom: none; }
    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      width: 30px;
      height: 30px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      top: 14px;
    }
    .steps li strong { color: #fff; }
    .steps code {
      background: #1a1a1a;
      color: #f0c674;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 18px;
      font-family: "SF Mono", Monaco, monospace;
    }
  </style>
</head>
<body>

  <div class="capture">
    <div class="badge">Quick Setup</div>
    <h1>Install Unbound</h1>
    <ol class="steps">
      <li>Install <strong>Unbound</strong></li>
      <li>Open <strong>Pi-hole</strong> &rarr; Settings &rarr; DNS</li>
      <li>Set Custom DNS servers to <code>127.0.0.1#5335</code></li>
      <li>Uncheck all other DNS servers</li>
      <li>Save</li>
    </ol>
  </div>

</body>
</html>
