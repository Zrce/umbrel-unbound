<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #fff; }
    .capture {
      width: 1440px;
      height: 900px;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1520;
      color: #b08df0;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
    }
    .subtitle {
      color: #666;
      font-size: 18px;
      margin-bottom: 64px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 280px);
      gap: 24px;
    }
    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 36px 28px;
    }
    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 22px;
    }
    .card:nth-child(1) .card-icon { background: #112b11; }
    .card:nth-child(2) .card-icon { background: #0f1a2e; }
    .card:nth-child(3) .card-icon { background: #2b1f11; }
    .card:nth-child(4) .card-icon { background: #1a1520; }
    .card h3 {
      font-size: 19px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
    }
    .card p {
      font-size: 14px;
      color: #777;
      line-height: 1.5;
    }
    .card .tag {
      display: inline-block;
      margin-top: 16px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .card:nth-child(1) .tag { background: #112b11; color: #4ade80; }
    .card:nth-child(2) .tag { background: #0f1a2e; color: #5b9bf0; }
    .card:nth-child(3) .tag { background: #2b1f11; color: #f0a050; }
    .card:nth-child(4) .tag { background: #1a1520; color: #b08df0; }
  </style>
</head>
<body>

  <div class="capture">
    <div class="badge">Open Standards</div>
    <h1>Privacy and security by design</h1>
    <div class="grid" style="margin-top: 64px;">
      <div class="card">
        <div class="card-icon">&#x1F512;</div>
        <h3>DNSSEC</h3>
        <span class="tag">Enabled by default</span>
      </div>
      <div class="card">
        <div class="card-icon">&#x1F50D;</div>
        <h3>QNAME Minimisation</h3>
        <span class="tag">RFC 7816</span>
      </div>
      <div class="card">
        <div class="card-icon">&#x26A1;</div>
        <h3>Aggressive Caching</h3>
        <span class="tag">RFC 8198</span>
      </div>
      <div class="card">
        <div class="card-icon">&#x1F6E1;</div>
        <h3>Full Recursion</h3>
        <span class="tag">Zero third parties</span>
      </div>
    </div>
  </div>

</body>
</html>
